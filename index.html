<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Portal Lab 🌌</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;background:rgba(8,9,20,.58);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;z-index:10}.row{margin-bottom:12px}.row:last-child{margin:0}label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:0;border-radius:11px;padding:11px 5px;background:rgba(255,255,255,.1);color:#fff;font-size:12px}button:active{transform:scale(.97);background:rgba(255,255,255,.2)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:9px}</style></head><body><div id="app"></div><div id="controls"><div class="row"><label><span>Energy</span><span id="energyValue">0.72</span></label><input id="energy" type="range" min="0" max="1" step=".01" value=".72"></div><div class="row"><label><span>Portal Size</span><span id="sizeValue">1.35</span></label><input id="size" type="range" min=".7" max="2.2" step=".01" value="1.35"></div><div class="row"><div class="buttons"><button id="open">🌀 Open</button><button id="pulse">✨ Pulse</button><button id="reset">↩︎ Reset</button></div></div><div class="hint">👆 Drag = look around &nbsp; • &nbsp; 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x010208);scene.fog=new THREE.FogExp2(0x040714,.016);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);let distance=5,yaw=0,pitch=0;const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<2100;i++){const r=8+Math.random()*25,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);stars.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p))}starsGeo.setAttribute("position",new THREE.Float32BufferAttribute(stars,3));const starMat=new THREE.PointsMaterial({color:0xffffff,size:.042,sizeAttenuation:true,transparent:true,opacity:.82,depthWrite:false});const starField=new THREE.Points(starsGeo,starMat);scene.add(starField);const portal=new THREE.Group();scene.add(portal);const voidMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime:{value:0},uOpen:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uOpen;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.-1.;float r=length(p);float a=atan(p.y,p.x);float n=noise(vec2(a*3.5,r*5.-uTime*.25));float boundary=.70+.085*n+.035*noise(vec2(a*8.-uTime*.5,r*9.));float hole=smoothstep(boundary,boundary-.035,r);float inner=smoothstep(.68,.18,r);float swirl=noise(vec2(a*3.0+uTime*.65,r*7.-uTime*1.1));vec3 c=vec3(.001,.002,.009)+vec3(.008,.012,.035)*swirl;float alpha=(1.-hole)*inner*.96*uOpen;gl_FragColor=vec4(c,alpha);}`});const voidMesh=new THREE.Mesh(new THREE.PlaneGeometry(3.5,3.5),voidMat);voidMesh.position.z=.035;portal.add(voidMesh);const rimMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uEnergy:{value:.72},uOpen:{value:0},uPulse:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uEnergy;uniform float uOpen;uniform float uPulse;float hash(vec2 p){return fract(sin(dot(p,vec2(41.7,113.9)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.-1.;float r=length(p),a=atan(p.y,p.x);float n=noise(vec2(a*4.+uTime*.35,r*4.-uTime*.5));float n2=noise(vec2(a*11.-uTime*1.15,r*10.+uTime*.7));float boundary=.70+.095*n+.045*n2;float d=abs(r-boundary);float core=smoothstep(.075,.008,d);float filament=pow(max(0.,noise(vec2(a*15.+uTime*2.2,r*18.-uTime*1.7))-.48),2.0);float flare=pow(max(0.,n2-.48),3.)*2.5;float alpha=(core*(.5+uEnergy*1.25)+filament*.42+flare*.55)*(uOpen+.25*uPulse);vec3 c=mix(vec3(.12,.28,1.),vec3(.72,.08,1.),.5+.5*sin(a*2.+n*4.));c+=vec3(.35,.4,1.)*flare;gl_FragColor=vec4(c,alpha);}`});const rim=new THREE.Mesh(new THREE.PlaneGeometry(3.5,3.5),rimMat);rim.position.z=.07;portal.add(rim);const glowMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uEnergy:{value:.72},uOpen:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uEnergy;uniform float uOpen;float hash(vec2 p){return fract(sin(dot(p,vec2(19.2,71.3)))*43758.5);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.-1.;float r=length(p),a=atan(p.y,p.x);float n=noise(vec2(a*3.+uTime*.3,r*5.-uTime*.4));float b=.72+.1*n;float d=abs(r-b);float g=exp(-d*18.)*.65+exp(-d*55.)*.35;g*=smoothstep(1.05,.2,r);vec3 c=mix(vec3(.05,.2,1.),vec3(.6,.05,1.),.5+.5*sin(a*3.+uTime));gl_FragColor=vec4(c,g*(.25+uEnergy*.7)*uOpen);}`});const glow=new THREE.Mesh(new THREE.PlaneGeometry(4.2,4.2),glowMat);glow.position.z=-.01;portal.add(glow);const filamentGroup=new THREE.Group();portal.add(filamentGroup);for(let k=0;k<34;k++){const pts=[];const phase=Math.random()*Math.PI*2,speed=.35+Math.random()*1.1;for(let j=0;j<80;j++){const t=j/79,a=phase+t*(Math.PI*2)*(0.55+Math.random()*.25),r=.68+t*(.65+Math.random()*.18)+Math.sin(t*18+phase)*.035;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,.08+Math.sin(t*12+phase)*.025))}const g=new THREE.BufferGeometry().setFromPoints(pts);const m=new THREE.LineBasicMaterial({color:k%3===0?0x9ec5ff:0x795cff,transparent:true,opacity:.06+Math.random()*.12,blending:THREE.AdditiveBlending,depthWrite:false});const line=new THREE.Line(g,m);line.userData.speed=speed;line.userData.phase=phase;filamentGroup.add(line)}const particleGeo=new THREE.BufferGeometry(),pp=[];for(let i=0;i<900;i++){const a=Math.random()*Math.PI*2,r=.72+Math.random()*1.05;pp.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-.5)*.16)}particleGeo.setAttribute("position",new THREE.Float32BufferAttribute(pp,3));const particleMat=new THREE.PointsMaterial({color:0xc8d5ff,size:.023,sizeAttenuation:true,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false});const particles=new THREE.Points(particleGeo,particleMat);portal.add(particles);const energy=document.getElementById("energy"),energyValue=document.getElementById("energyValue"),size=document.getElementById("size"),sizeValue=document.getElementById("sizeValue");let energyNum=.72,sizeNum=1.35;energy.addEventListener("input",()=>{energyNum=+energy.value;energyValue.textContent=energyNum.toFixed(2)});size.addEventListener("input",()=>{sizeNum=+size.value;sizeValue.textContent=sizeNum.toFixed(2)});let opening=0,pulse=0;document.getElementById("open").onclick=()=>opening=opening<.5?1:0;document.getElementById("pulse").onclick=()=>pulse=1;document.getElementById("reset").onclick=()=>{opening=0;pulse=0};const active=new Map();let pinch=null;renderer.domElement.addEventListener("pointerdown",e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(active.size===2){const a=[...active.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const a=[...active.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch!==null)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.01,2.2,10);pinch=d;return}yaw+=(e.clientX-old.x)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-old.y)*.006,-1.2,1.2)});function end(e){active.delete(e.pointerId);if(active.size<2)pinch=null}renderer.domElement.addEventListener("pointerup",end);renderer.domElement.addEventListener("pointercancel",end);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let time=0;function animate(){time+=.016;const o=THREE.MathUtils.damp(portal.userData.o||0,opening,3.2,.016);portal.userData.o=o;portal.scale.setScalar((.72+.28*o)*(sizeNum/1.35));voidMat.uniforms.uTime.value=time;voidMat.uniforms.uOpen.value=o;rimMat.uniforms.uTime.value=time;rimMat.uniforms.uEnergy.value=energyNum;rimMat.uniforms.uOpen.value=o;rimMat.uniforms.uPulse.value=pulse;glowMat.uniforms.uTime.value=time;glowMat.uniforms.uEnergy.value=energyNum;glowMat.uniforms.uOpen.value=o;filamentGroup.rotation.z-=.0015+o*.004;filamentGroup.children.forEach((l,i)=>{l.rotation.z+=.0004*l.userData.speed; l.material.opacity=(.035+.1*energyNum)*(0.65+0.35*Math.sin(time*l.userData.speed*2+l.userData.phase))});const pos=particleGeo.attributes.position;for(let i=0;i<pos.count;i++){const j=i*3,x=pos.array[j],y=pos.array[j+1],r=Math.hypot(x,y),a=Math.atan2(y,x)-(.004+o*.018)*(1.15+.5/r),nr=r-(.0012+o*.0025);if(nr<.61){const rr=.75+Math.random()*1.0,aa=Math.random()*Math.PI*2;pos.array[j]=Math.cos(aa)*rr;pos.array[j+1]=Math.sin(aa)*rr}else{pos.array[j]=Math.cos(a)*nr;pos.array[j+1]=Math.sin(a)*nr}}pos.needsUpdate=true;if(pulse>0){pulse=Math.max(0,pulse-.022);glow.scale.setScalar(1+(1-pulse)*.22);particleMat.opacity=.7+(1-pulse)*.5}else{glow.scale.setScalar(1);particleMat.opacity=.7}starField.rotation.y+=.0001;starMat.opacity=.7+Math.sin(time*1.3)*.1;camera.position.x=Math.sin(yaw)*Math.cos(pitch)*distance;camera.position.y=Math.sin(pitch)*distance;camera.position.z=Math.cos(yaw)*Math.cos(pitch)*distance;camera.lookAt(0,0,0);renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
