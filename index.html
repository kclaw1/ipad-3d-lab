<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>3D Blob Lab 🫧</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #controls {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      max-height: 55vh;
      overflow-y: auto;

      padding: 15px;

      background: rgba(20, 20, 28, 0.78);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;

      color: white;
      z-index: 10;
    }

    .row {
      margin-bottom: 13px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 10px 4px;

      background: rgba(255,255,255,0.1);
      color: white;

      font-size: 12px;
      transition: transform 0.12s, background 0.12s;
    }

    button:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.22);
    }

    button.active {
      background: rgba(255,255,255,0.25);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .hint {
      text-align: center;
      opacity: 0.5;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="app"></div>

<div id="controls">

  <!-- ROUGHNESS -->

  <div class="row">

    <label>
      <span>Roughness</span>
      <span id="roughnessValue">0.25</span>
    </label>

    <input
      id="roughness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.25"
    >

  </div>


  <!-- METALNESS -->

  <div class="row">

    <label>
      <span>Metalness</span>
      <span id="metalnessValue">0.35</span>
    </label>

    <input
      id="metalness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.35"
    >

  </div>


  <!-- BLOBINESS -->

  <div class="row">

    <label>
      <span>Blobiness 🫠</span>
      <span id="blobValue">0.25</span>
    </label>

    <input
      id="blobiness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.25"
    >

  </div>


  <!-- COLOR -->

  <div class="row">

    <button id="colorButton">
      🎨 Change Color
    </button>

  </div>


  <!-- CAMERA -->

  <div class="row">

    <label>
      <span>Camera 🎥</span>
    </label>

    <div class="buttons">

      <button data-camera="object">
        Object
      </button>

      <button data-camera="orbit">
        Orbit
      </button>

      <button data-camera="cinematic" class="active">
        Cinema
      </button>

      <button data-camera="parallax">
        Float
      </button>

    </div>

  </div>


  <!-- GEOMETRY -->

  <div class="row">

    <label>
      <span>Shape</span>
    </label>

    <div class="buttons">

      <button data-shape="cube">
        Cube
      </button>

      <button data-shape="sphere">
        Sphere
      </button>

      <button data-shape="torus">
        Torus
      </button>

      <button data-shape="blob" class="active">
        🫧 Blob
      </button>

    </div>

  </div>


  <div class="hint">
    👆 Drag = move camera / rotate
    &nbsp; • &nbsp;
    🤏 Pinch = zoom
  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x050510);

scene.fog =
  new THREE.Fog(
    0x050510,
    4,
    12
  );


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
  );

let cameraDistance = 4;

camera.position.set(
  0,
  0,
  cameraDistance
);


// Camera state

let cameraMode = "cinematic";

let cameraYaw = 0;
let cameraPitch = 0;

let targetCameraX = 0;
let targetCameraY = 0;


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.domElement.style.touchAction =
  "none";

document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  );


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(
  ambientLight
);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    4
  );

keyLight.position.set(
  3,
  4,
  5
);

scene.add(
  keyLight
);


const fillLight =
  new THREE.DirectionalLight(
    0x6688ff,
    2
  );

fillLight.position.set(
  -4,
  -2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// STARS
// ============================================================

const starGeometry =
  new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 1200; i++) {

  starPositions.push(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50
  );

}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starPositions,
    3
  )
);

const stars =
  new THREE.Points(
    starGeometry,

    new THREE.PointsMaterial({
      size: 0.04,
      transparent: true,
      opacity: 0.75
    })
  );

scene.add(stars);


// ============================================================
// MATERIAL
// ============================================================

const material =
  new THREE.MeshStandardMaterial({

    color: 0xff66cc,

    metalness: 0.35,

    roughness: 0.25

  });


// ============================================================
// BLOB GEOMETRY
// ============================================================

function createBlob() {

  const geometry =
    new THREE.SphereGeometry(
      1.1,
      96,
      96
    );

  const position =
    geometry.attributes.position;

  const original =
    position.array.slice();

  geometry.userData.original =
    original;

  return geometry;

}


// ============================================================
// GEOMETRY CREATOR
// ============================================================

function createGeometry(type) {

  switch (type) {

    case "cube":

      return new THREE.BoxGeometry(
        1.6,
        1.6,
        1.6
      );


    case "sphere":

      return new THREE.SphereGeometry(
        1.1,
        64,
        64
      );


    case "torus":

      return new THREE.TorusGeometry(
        1,
        0.35,
        32,
        100
      );


    case "blob":

      return createBlob();

  }

}


// ============================================================
// OBJECT
// ============================================================

let currentShape =
  "blob";

let geometry =
  createGeometry(
    currentShape
  );

let object =
  new THREE.Mesh(
    geometry,
    material
  );

scene.add(
  object
);


// ============================================================
// GLOW HALO
// ============================================================

const glowGeometry =
  new THREE.SphereGeometry(
    1.7,
    64,
    64
  );

const glowMaterial =
  new THREE.MeshBasicMaterial({

    color: 0x9966ff,

    transparent: true,

    opacity: 0.08

  });

const glow =
  new THREE.Mesh(
    glowGeometry,
    glowMaterial
  );

scene.add(glow);


// ============================================================
// BLOB SETTINGS
// ============================================================

let blobiness =
  0.25;

let time = 0;


// ============================================================
// DEFORM BLOB
// ============================================================

function deformBlob() {

  if (
    currentShape !== "blob"
  ) return;


  const position =
    object.geometry
      .attributes
      .position;

  const original =
    object.geometry
      .userData
      .original;


  if (!original) return;


  for (
    let i = 0;
    i < position.count;
    i++
  ) {

    const x =
      original[i * 3];

    const y =
      original[i * 3 + 1];

    const z =
      original[i * 3 + 2];


    const length =
      Math.sqrt(
        x*x +
        y*y +
        z*z
      );


    const nx =
      x / length;

    const ny =
      y / length;

    const nz =
      z / length;


    const wave =
      Math.sin(
        x * 3 +
        time
      )
      *
      Math.cos(
        y * 2.5 +
        time * 0.7
      )
      *
      Math.sin(
        z * 2 +
        time * 0.5
      );


    const amount =
      1 +
      wave *
      blobiness *
      0.35;


    position.setXYZ(

      i,

      nx * length * amount,

      ny * length * amount,

      nz * length * amount

    );

  }


  position.needsUpdate =
    true;

  object.geometry
    .computeVertexNormals();

}


// ============================================================
// ROUGHNESS
// ============================================================

const roughnessSlider =
  document.getElementById(
    "roughness"
  );

const roughnessValue =
  document.getElementById(
    "roughnessValue"
  );


roughnessSlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        roughnessSlider.value
      );

    material.roughness =
      value;

    roughnessValue.textContent =
      value.toFixed(2);

  }
);


// ============================================================
// METALNESS
// ============================================================

const metalnessSlider =
  document.getElementById(
    "metalness"
  );

const metalnessValue =
  document.getElementById(
    "metalnessValue"
  );


metalnessSlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        metalnessSlider.value
      );

    material.metalness =
      value;

    metalnessValue.textContent =
      value.toFixed(2);

  }
);


// ============================================================
// BLOBINESS
// ============================================================

const blobSlider =
  document.getElementById(
    "blobiness"
  );

const blobValue =
  document.getElementById(
    "blobValue"
  );


blobSlider.addEventListener(
  "input",
  () => {

    blobiness =
      Number(
        blobSlider.value
      );

    blobValue.textContent =
      blobiness.toFixed(2);

  }
);


// ============================================================
// COLORS
// ============================================================

const colors = [

  0xff66cc,
  0x66ddff,
  0x9966ff,
  0xffcc66,
  0x66ff99,
  0xff6677,
  0xffffff

];

let colorIndex = 0;


document
  .getElementById(
    "colorButton"
  )
  .addEventListener(
    "click",
    () => {

      colorIndex =
        (
          colorIndex + 1
        )
        %
        colors.length;

      material.color.setHex(
        colors[colorIndex]
      );

      glowMaterial.color.setHex(
        colors[colorIndex]
      );

    }
  );


// ============================================================
// SHAPE BUTTONS
// ============================================================

document
  .querySelectorAll(
    "[data-shape]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const type =
            button.dataset.shape;


          const newGeometry =
            createGeometry(
              type
            );


          object.geometry
            .dispose();


          object.geometry =
            newGeometry;


          currentShape =
            type;


          document
            .querySelectorAll(
              "[data-shape]"
            )
            .forEach(
              b => b.classList.remove(
                "active"
              )
            );

          button.classList.add(
            "active"
          );

        }
      );

    }
  );


// ============================================================
// CAMERA BUTTONS
// ============================================================

document
  .querySelectorAll(
    "[data-camera]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          cameraMode =
            button.dataset.camera;


          document
            .querySelectorAll(
              "[data-camera]"
            )
            .forEach(
              b => b.classList.remove(
                "active"
              )
            );


          button.classList.add(
            "active"
          );


          // Reset camera targets

          if (
            cameraMode === "object"
          ) {

            targetCameraX = 0;
            targetCameraY = 0;

          }

        }
      );

    }
  );


// ============================================================
// TOUCH / POINTER STATE
// ============================================================

const activePointers =
  new Map();

let previousX = 0;
let previousY = 0;

let pinchDistance = null;


// ============================================================
// POINTER DOWN
// ============================================================

renderer.domElement
  .addEventListener(
    "pointerdown",
    event => {

      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );


      renderer.domElement
        .setPointerCapture(
          event.pointerId
        );


      if (
        activePointers.size === 1
      ) {

        previousX =
          event.clientX;

        previousY =
          event.clientY;

      }


      if (
        activePointers.size === 2
      ) {

        const points =
          [...activePointers.values()];

        pinchDistance =
          distance(
            points[0],
            points[1]
          );

      }

    }
  );


// ============================================================
// POINTER MOVE
// ============================================================

renderer.domElement
  .addEventListener(
    "pointermove",
    event => {

      if (
        !activePointers.has(
          event.pointerId
        )
      ) return;


      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );


      // -------------------------
      // PINCH
      // -------------------------

      if (
        activePointers.size === 2
      ) {

        const points =
          [...activePointers.values()];


        const newDistance =
          distance(
            points[0],
            points[1]
          );


        if (
          pinchDistance !== null
        ) {

          const delta =
            newDistance -
            pinchDistance;


          cameraDistance -=
            delta * 0.01;


          cameraDistance =
            THREE.MathUtils.clamp(
              cameraDistance,
              2,
              8
            );

        }


        pinchDistance =
          newDistance;


        return;

      }


      // -------------------------
      // SINGLE FINGER DRAG
      // -------------------------

      const deltaX =
        event.clientX -
        previousX;

      const deltaY =
        event.clientY -
        previousY;


      if (
        cameraMode === "object"
      ) {

        object.rotation.y +=
          deltaX * 0.01;

        object.rotation.x +=
          deltaY * 0.01;

      }


      if (
        cameraMode === "orbit"
      ) {

        cameraYaw +=
          deltaX * 0.01;

        cameraPitch +=
          deltaY * 0.005;


        cameraPitch =
          THREE.MathUtils.clamp(
            cameraPitch,
            -1.2,
            1.2
          );

      }


      if (
        cameraMode === "parallax"
      ) {

        targetCameraX +=
          deltaX * 0.01;

        targetCameraY -=
          deltaY * 0.01;


        targetCameraX =
          THREE.MathUtils.clamp(
            targetCameraX,
            -1.5,
            1.5
          );


        targetCameraY =
          THREE.MathUtils.clamp(
            targetCameraY,
            -1,
            1
          );

      }


      previousX =
        event.clientX;

      previousY =
        event.clientY;

    }
  );


// ============================================================
// POINTER UP
// ============================================================

renderer.domElement
  .addEventListener(
    "pointerup",
    event => {

      activePointers.delete(
        event.pointerId
      );


      if (
        activePointers.size < 2
      ) {

        pinchDistance =
          null;

      }

    }
  );


// ============================================================
// POINTER CANCEL
// ============================================================

renderer.domElement
  .addEventListener(
    "pointercancel",
    event => {

      activePointers.delete(
        event.pointerId
      );

      pinchDistance =
        null;

    }
  );


// ============================================================
// DISTANCE
// ============================================================

function distance(
  a,
  b
) {

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  time += 0.025;


  // -------------------------
  // BLOB
  // -------------------------

  deformBlob();


  // -------------------------
  // BREATHING
  // -------------------------

  const pulse =
    1 +
    Math.sin(time * 2)
    * 0.03;

  object.scale.set(
    pulse,
    pulse,
    pulse
  );


  // -------------------------
  // GLOW
  // -------------------------

  glow.position.copy(
    object.position
  );

  glow.scale.setScalar(
    1.1 +
    Math.sin(time * 2)
    * 0.05
  );


  // -------------------------
  // STARS
  // -------------------------

  stars.rotation.y +=
    0.0003;


  // ==========================================================
  // CAMERA
  // ==========================================================

  if (
    cameraMode === "object"
  ) {

    camera.position.x +=
      (0 - camera.position.x)
      * 0.08;

    camera.position.y +=
      (0 - camera.position.y)
      * 0.08;

    camera.position.z +=
      (
        cameraDistance -
        camera.position.z
      ) * 0.08;

    camera.lookAt(
      0,
      0,
      0
    );

  }


  // -------------------------
  // ORBIT
  // -------------------------

  if (
    cameraMode === "orbit"
  ) {

    const radius =
      cameraDistance;


    camera.position.x =
      Math.sin(cameraYaw)
      *
      Math.cos(cameraPitch)
      *
      radius;


    camera.position.y =
      Math.sin(cameraPitch)
      *
      radius;


    camera.position.z =
      Math.cos(cameraYaw)
      *
      Math.cos(cameraPitch)
      *
      radius;


    camera.lookAt(
      0,
      0,
      0
    );

  }


  // -------------------------
  // CINEMATIC
  // -------------------------

  if (
    cameraMode === "cinematic"
  ) {

    camera.position.x =
      Math.sin(
        time * 0.35
      )
      * 0.7;


    camera.position.y =
      Math.cos(
        time * 0.25
      )
      * 0.35;


    camera.position.z =
      cameraDistance +
      Math.sin(
        time * 0.15
      )
      * 0.25;


    camera.lookAt(
      0,
      0,
      0
    );

  }


  // -------------------------
  // FLOAT / PARALLAX
  // -------------------------

  if (
    cameraMode === "parallax"
  ) {

    const desiredX =
      targetCameraX;

    const desiredY =
      targetCameraY;


    camera.position.x +=
      (
        desiredX -
        camera.position.x
      ) * 0.05;


    camera.position.y +=
      (
        desiredY -
        camera.position.y
      ) * 0.05;


    camera.position.z +=
      (
        cameraDistance -
        camera.position.z
      ) * 0.08;


    camera.lookAt(
      0,
      0,
      0
    );

  }


  // -------------------------
  // RENDER
  // -------------------------

  renderer.render(
    scene,
    camera
  );

}


renderer.setAnimationLoop(
  animate
);

</script>

</body>
</html>
