<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Portal Lab 🌌</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;background:rgba(8,9,20,.58);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;z-index:10}.row{margin-bottom:12px}.row:last-child{margin:0}label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:0;border-radius:11px;padding:11px 5px;background:rgba(255,255,255,.1);color:#fff;font-size:12px}button:active{transform:scale(.97);background:rgba(255,255,255,.2)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:9px}</style></head><body><div id="app"></div><div id="controls"><div class="row"><label><span>Energy</span><span id="energyValue">0.72</span></label><input id="energy" type="range" min="0" max="1" step=".01" value=".72"></div><div class="row"><label><span>Portal Size</span><span id="sizeValue">1.35</span></label><input id="size" type="range" min=".7" max="2.2" step=".01" value="1.35"></div><div class="row"><div class="buttons"><button id="open">🌀 Open</button><button id="pulse">✨ Pulse</button><button id="reset">↩︎ Reset</button></div></div><div class="hint">👆 Drag = orbit &nbsp; • &nbsp; 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x010208);scene.fog=new THREE.FogExp2(0x040714,.012);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);let distance=5,yaw=0,pitch=0;const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0x6570aa,.7));const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<1900;i++){const r=8+Math.random()*24,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);starPos.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p))}starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPos,3));const starMat=new THREE.PointsMaterial({color:0xffffff,size:.04,sizeAttenuation:true,transparent:true,opacity:.82,depthWrite:false});const starField=new THREE.Points(starGeo,starMat);scene.add(starField);const portal=new THREE.Group();scene.add(portal);const voidMat=new THREE.MeshBasicMaterial({color:0x000006,side:THREE.DoubleSide});const voidMesh=new THREE.Mesh(new THREE.CircleGeometry(1.08,128),voidMat);voidMesh.position.z=.02;portal.add(voidMesh);function makeEnergyGeometry(glow=false){const path=128,tube=18;const pos=new Float32Array((path+1)*(tube+1)*3),norm=new Float32Array((path+1)*(tube+1)*3),uv=new Float32Array((path+1)*(tube+1)*2),idx=[];for(let i=0;i<=path;i++){const u=i/path,a=u*Math.PI*2;const head=Math.pow(Math.max(0,Math.cos(a)),10);const wake=Math.pow(Math.max(0,Math.cos(a+.42)),4);const tail=Math.pow(Math.max(0,Math.cos(a+.9)),2);const centerR=1.28+.035*Math.sin(a*3)+.025*Math.sin(a*7);const tubeR=glow?.22:(.105+.17*head+.035*wake)*(0.78+.22*energyNum);for(let j=0;j<=tube;j++){const v=j/tube* Math.PI*2;const rr=centerR+tubeR*Math.cos(v);const x=rr*Math.cos(a),y=rr*Math.sin(a),z=tubeR*Math.sin(v);const k=(i*(tube+1)+j)*3;pos[k]=x;pos[k+1]=y;pos[k+2]=z;const nx=Math.cos(v)*Math.cos(a),ny=Math.cos(v)*Math.sin(a),nz=Math.sin(v);norm[k]=nx;norm[k+1]=ny;norm[k+2]=nz;const q=(i*(tube+1)+j)*2;uv[q]=u;uv[q+1]=v/(Math.PI*2)}}for(let i=0;i<path;i++)for(let j=0;j<tube;j++){const a=i*(tube+1)+j,b=a+1,c=a+(tube+1),d=c+1;idx.push(a,b,d,a,d,c)}const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("normal",new THREE.BufferAttribute(norm,3));g.setAttribute("uv",new THREE.BufferAttribute(uv,2));g.setIndex(idx);return g}let energyNum=.72;const energyMat=new THREE.MeshStandardMaterial({color:0x9db8ff,emissive:0x7898ff,emissiveIntensity:3,roughness:.22,metalness:.05});const energyMesh=new THREE.Mesh(makeEnergyGeometry(false),energyMat);portal.add(energyMesh);const glowMat=new THREE.MeshBasicMaterial({color:0x6d8fff,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const glowMesh=new THREE.Mesh(makeEnergyGeometry(true),glowMat);portal.add(glowMesh);const particleCount=22,particleGroup=new THREE.Group();portal.add(particleGroup);const trails=[];for(let i=0;i<particleCount;i++){const g=new THREE.BufferGeometry(),pts=new Float32Array(10*3);g.setAttribute("position",new THREE.BufferAttribute(pts,3));const m=new THREE.LineBasicMaterial({color:0xe6efff,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false});const line=new THREE.Line(g,m);line.userData={phase:Math.random()*Math.PI*2,speed:.55+Math.random()*.55,len:.18+Math.random()*.28};particleGroup.add(line);trails.push(line)}const energy=document.getElementById("energy"),energyValue=document.getElementById("energyValue"),size=document.getElementById("size"),sizeValue=document.getElementById("sizeValue");energy.addEventListener("input",()=>{energyNum=+energy.value;energyValue.textContent=energyNum.toFixed(2);energyMesh.geometry.dispose();glowMesh.geometry.dispose();energyMesh.geometry=makeEnergyGeometry(false);glowMesh.geometry=makeEnergyGeometry(true)});let sizeNum=1.35;size.addEventListener("input",()=>{sizeNum=+size.value;sizeValue.textContent=sizeNum.toFixed(2)});let opening=1,pulse=0;document.getElementById("open").onclick=()=>opening=opening<.5?1:0;document.getElementById("pulse").onclick=()=>pulse=1;document.getElementById("reset").onclick=()=>{opening=0;pulse=0};const active=new Map();let pinch=null;renderer.domElement.addEventListener("pointerdown",e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(active.size===2){const a=[...active.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const a=[...active.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch!==null)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.01,2.2,10);pinch=d;return}yaw+=(e.clientX-old.x)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-old.y)*.006,-1.2,1.2)});function end(e){active.delete(e.pointerId);if(active.size<2)pinch=null}renderer.domElement.addEventListener("pointerup",end);renderer.domElement.addEventListener("pointercancel",end);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let time=0;function animate(){time+=.016;const o=THREE.MathUtils.damp(portal.userData.o??1,opening,3.2,.016);portal.userData.o=o;portal.scale.setScalar((.72+.28*o)*(sizeNum/1.35));energyMesh.rotation.z=time*.18;glowMesh.rotation.z=time*.18;energyMesh.rotation.x=Math.sin(time*.55)*.08;energyMesh.rotation.y=Math.cos(time*.42)*.08;energyMat.emissiveIntensity=2.2+energyNum*3.2+(pulse>0?(1-pulse)*2:0);glowMat.opacity=.08+energyNum*.16+(pulse>0?(1-pulse)*.12:0);if(pulse>0){pulse=Math.max(0,pulse-.022)}const head=time*1.05;trails.forEach((line,i)=>{const d=line.userData,pts=line.geometry.attributes.position.array;for(let j=0;j<10;j++){const t=j/9,a=head*d.speed+d.phase-d.len*t,r=1.30+.045*Math.sin(a*3)+.018*Math.sin(a*7);pts[j*3]=Math.cos(a)*r;pts[j*3+1]=Math.sin(a)*r;pts[j*3+2]=.06*Math.sin(a*2)+.025*(1-t)}line.geometry.attributes.position.needsUpdate=true;line.material.opacity=.08+.22*energyNum*(1-i/particleCount*.45)});starField.rotation.y+=.00008;starMat.opacity=.74+Math.sin(time*1.2)*.08;camera.position.x=Math.sin(yaw)*Math.cos(pitch)*distance;camera.position.y=Math.sin(pitch)*distance;camera.position.z=Math.cos(yaw)*Math.cos(pitch)*distance;camera.lookAt(0,0,0);renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
