<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Portal Lab 🌌</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;background:rgba(12,12,24,.68);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;z-index:10}.row{margin-bottom:12px}.row:last-child{margin:0}label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:0;border-radius:11px;padding:11px 5px;background:rgba(255,255,255,.1);color:#fff;font-size:12px}button:active{transform:scale(.97);background:rgba(255,255,255,.2)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:9px}</style></head><body><div id="app"></div><div id="controls"><div class="row"><label><span>Portal Energy</span><span id="energyValue">0.65</span></label><input id="energy" type="range" min="0" max="1" step=".01" value=".65"></div><div class="row"><label><span>Portal Size</span><span id="sizeValue">1.35</span></label><input id="size" type="range" min=".7" max="2.2" step=".01" value="1.35"></div><div class="row"><div class="buttons"><button id="open">🌀 Open</button><button id="pulse">✨ Pulse</button><button id="reset">↩︎ Reset</button></div></div><div class="hint">👆 Drag = look around &nbsp; • &nbsp; 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);scene.fog=new THREE.FogExp2(0x050817,.018);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,0,5);let distance=5,yaw=0,pitch=0;const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0x4455aa,1.2));const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<1800;i++){const r=8+Math.random()*22,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);stars.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p))}starsGeo.setAttribute("position",new THREE.Float32BufferAttribute(stars,3));const starMat=new THREE.PointsMaterial({color:0xffffff,size:.045,sizeAttenuation:true,transparent:true,opacity:.9,depthWrite:false});const starField=new THREE.Points(starsGeo,starMat);scene.add(starField);const portal=new THREE.Group();scene.add(portal);const ringGeo=new THREE.TorusGeometry(1.35,.13,24,160);const ringMat=new THREE.MeshBasicMaterial({color:0x8f66ff,transparent:true,opacity:.95});const ring=new THREE.Mesh(ringGeo,ringMat);portal.add(ring);const innerGeo=new THREE.CircleGeometry(1.22,96);const innerMat=new THREE.MeshBasicMaterial({color:0x070b25,transparent:true,opacity:.98,side:THREE.DoubleSide});const inner=new THREE.Mesh(innerGeo,innerMat);portal.add(inner);const portalStarsGeo=new THREE.BufferGeometry(),portalStars=[];for(let i=0;i<420;i++){const r=Math.sqrt(Math.random())*1.15,t=Math.random()*Math.PI*2;portalStars.push(Math.cos(t)*r,Math.sin(t)*r,(Math.random()-.5)*.04)}portalStarsGeo.setAttribute("position",new THREE.Float32BufferAttribute(portalStars,3));const portalStarsMat=new THREE.PointsMaterial({color:0xcfd8ff,size:.028,transparent:true,opacity:.95,depthWrite:false});const portalStarsMesh=new THREE.Points(portalStarsGeo,portalStarsMat);portalStarsMesh.position.z=.025;portal.add(portalStarsMesh);const glowGeo=new THREE.TorusGeometry(1.35,.28,20,160);const glowMat=new THREE.MeshBasicMaterial({color:0x5d3cff,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false});const glow=new THREE.Mesh(glowGeo,glowMat);portal.add(glow);const energy=document.getElementById("energy"),energyValue=document.getElementById("energyValue"),size=document.getElementById("size"),sizeValue=document.getElementById("sizeValue");let energyValueNum=.65,sizeValueNum=1.35;energy.addEventListener("input",()=>{energyValueNum=+energy.value;energyValue.textContent=energyValueNum.toFixed(2)});size.addEventListener("input",()=>{sizeValueNum=+size.value;sizeValue.textContent=sizeValueNum.toFixed(2);portal.scale.setScalar(sizeValueNum/1.35)});let opening=0,pulse=0;document.getElementById("open").addEventListener("click",()=>{opening=opening<.5?1:0});document.getElementById("pulse").addEventListener("click",()=>{pulse=1});document.getElementById("reset").addEventListener("click",()=>{opening=0;pulse=0;portal.scale.setScalar(sizeValueNum/1.35)});const active=new Map();let pinch=null,lastX=0,lastY=0;renderer.domElement.addEventListener("pointerdown",e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(active.size===1){lastX=e.clientX;lastY=e.clientY}else if(active.size===2){const a=[...active.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const a=[...active.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch!==null)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.01,2.2,10);pinch=d;return}const dx=e.clientX-old.x,dy=e.clientY-old.y;yaw+=dx*.008;pitch=THREE.MathUtils.clamp(pitch+dy*.006,-1.2,1.2);lastX=e.clientX;lastY=e.clientY});function end(e){active.delete(e.pointerId);if(active.size<2)pinch=null}renderer.domElement.addEventListener("pointerup",end);renderer.domElement.addEventListener("pointercancel",end);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let time=0;function animate(){time+=.016;const openTarget=opening;const openAmount=THREE.MathUtils.damp(portal.userData.open||0,openTarget,4,.016);portal.userData.open=openAmount;const s=(.82+.18*openAmount)*(sizeValueNum/1.35);portal.scale.setScalar(s);ringMat.opacity=.55+energyValueNum*.45;glowMat.opacity=.08+energyValueNum*.22;glow.scale.setScalar(1+Math.sin(time*3)*.025);portalStarsMesh.rotation.z+=.0015+openAmount*.004;starField.rotation.y+=.00015;starMat.opacity=.72+Math.sin(time*1.4)*.12;if(pulse>0){pulse=Math.max(0,pulse-.035);const p=1+(1-pulse)*.16;glow.scale.setScalar(p)}camera.position.x=Math.sin(yaw)*Math.cos(pitch)*distance;camera.position.y=Math.sin(pitch)*distance;camera.position.z=Math.cos(yaw)*Math.cos(pitch)*distance;camera.lookAt(0,0,0);renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
