<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Portal Lab 🌌</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;background:rgba(10,10,22,.62);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;z-index:10}.row{margin-bottom:12px}.row:last-child{margin:0}label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:0;border-radius:11px;padding:11px 5px;background:rgba(255,255,255,.1);color:#fff;font-size:12px}button:active{transform:scale(.97);background:rgba(255,255,255,.2)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:9px}</style></head><body><div id="app"></div><div id="controls"><div class="row"><label><span>Energy</span><span id="energyValue">0.70</span></label><input id="energy" type="range" min="0" max="1" step=".01" value=".70"></div><div class="row"><label><span>Portal Size</span><span id="sizeValue">1.35</span></label><input id="size" type="range" min=".7" max="2.2" step=".01" value="1.35"></div><div class="row"><div class="buttons"><button id="open">🌀 Open</button><button id="pulse">✨ Pulse</button><button id="reset">↩︎ Reset</button></div></div><div class="hint">👆 Drag = look around &nbsp; • &nbsp; 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);scene.fog=new THREE.FogExp2(0x050817,.018);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);let distance=5,yaw=0,pitch=0;camera.position.z=distance;const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<1900;i++){const r=8+Math.random()*24,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);stars.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p))}starsGeo.setAttribute("position",new THREE.Float32BufferAttribute(stars,3));const starMat=new THREE.PointsMaterial({color:0xffffff,size:.045,sizeAttenuation:true,transparent:true,opacity:.85,depthWrite:false});const starField=new THREE.Points(starsGeo,starMat);scene.add(starField);const portal=new THREE.Group();scene.add(portal);const portalMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uEnergy:{value:.7},uOpen:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;vec3 p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uEnergy;uniform float uOpen;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.0-1.0;float r=length(p);float a=atan(p.y,p.x);float n=noise(vec2(a*4.0+uTime*.7,r*5.0-uTime*.9));float n2=noise(vec2(a*9.0-uTime*1.2,r*8.0+uTime*.5));float edge=smoothstep(.12,.0,abs(r-(.73+.10*n+.045*n2)));float inner=smoothstep(.78,.46,r);float wisps=pow(max(0.0,noise(vec2(a*12.0+uTime*1.8,r*10.0-uTime*1.5))-.35),1.4);float alpha=(edge*(.45+uEnergy*.9)+wisps*.32*inner)*uOpen;vec3 c=mix(vec3(.18,.25,1.0),vec3(.82,.12,1.0),n);c+=vec3(.25,.35,1.0)*wisps;gl_FragColor=vec4(c,alpha);}`});const energyPlane=new THREE.Mesh(new THREE.PlaneGeometry(3.3,3.3,1,1),portalMat);portal.add(energyPlane);const vortexMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime:{value:0},uOpen:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uOpen;float hash(vec2 p){return fract(sin(dot(p,vec2(41.7,113.9)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.0-1.0;float r=length(p);float a=atan(p.y,p.x);float swirl=a+uTime*(1.3+1.8*(1.0-r));float n=noise(vec2(swirl*2.5,r*7.0-uTime*1.2));float center=smoothstep(.48,.02,r);float rim=smoothstep(.78,.52,r);float stars=pow(max(0.0,noise(vec2(swirl*10.0,r*18.0-uTime*2.0))-.68),4.0);vec3 c=vec3(.025,.04,.12)+vec3(.08,.12,.45)*n;float alpha=(center*.55+rim*.18+stars*.9)*uOpen;gl_FragColor=vec4(c,alpha);}`});const vortex=new THREE.Mesh(new THREE.CircleGeometry(1.42,128),vortexMat);vortex.position.z=.02;portal.add(vortex);const haloMat=new THREE.MeshBasicMaterial({color:0x6e55ff,transparent:true,opacity:.13,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const halo=new THREE.Mesh(new THREE.RingGeometry(1.25,1.75,128),haloMat);halo.position.z=-.03;portal.add(halo);const particleGeo=new THREE.BufferGeometry(),pp=[],pv=[];for(let i=0;i<650;i++){const a=Math.random()*Math.PI*2,r=.95+Math.random()*.9;pp.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-.5)*.08);pv.push(a,r,Math.random()*.6+.25)}particleGeo.setAttribute("position",new THREE.Float32BufferAttribute(pp,3));const particleMat=new THREE.PointsMaterial({color:0xb9c8ff,size:.025,sizeAttenuation:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});const particles=new THREE.Points(particleGeo,particleMat);portal.add(particles);const energy=document.getElementById("energy"),energyValue=document.getElementById("energyValue"),size=document.getElementById("size"),sizeValue=document.getElementById("sizeValue");let energyNum=.7,sizeNum=1.35;energy.addEventListener("input",()=>{energyNum=+energy.value;energyValue.textContent=energyNum.toFixed(2)});size.addEventListener("input",()=>{sizeNum=+size.value;sizeValue.textContent=sizeNum.toFixed(2)});let opening=0,pulse=0;document.getElementById("open").onclick=()=>opening=opening<.5?1:0;document.getElementById("pulse").onclick=()=>pulse=1;document.getElementById("reset").onclick=()=>{opening=0;pulse=0};const active=new Map();let pinch=null;renderer.domElement.addEventListener("pointerdown",e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(active.size===2){const a=[...active.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const a=[...active.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch!==null)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.01,2.2,10);pinch=d;return}yaw+=(e.clientX-old.x)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-old.y)*.006,-1.2,1.2)});function end(e){active.delete(e.pointerId);if(active.size<2)pinch=null}renderer.domElement.addEventListener("pointerup",end);renderer.domElement.addEventListener("pointercancel",end);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let time=0;function animate(){time+=.016;const o=THREE.MathUtils.damp(portal.userData.o||0,opening,3.5,.016);portal.userData.o=o;portal.scale.setScalar((.78+.22*o)*(sizeNum/1.35));portalMat.uniforms.uTime.value=time;portalMat.uniforms.uEnergy.value=energyNum;portalMat.uniforms.uOpen.value=o;vortexMat.uniforms.uTime.value=time;vortexMat.uniforms.uOpen.value=o;halo.material.opacity=.07+energyNum*.16;particles.rotation.z-=.0025+o*.008;const pos=particleGeo.attributes.position;for(let i=0;i<pos.count;i++){const j=i*3,x=pos.array[j],y=pos.array[j+1],r=Math.hypot(x,y),a=Math.atan2(y,x)-(.008+o*.025)*(1.0+.7/r);const nr=r-.0025*o;if(nr<.72){pos.array[j]=Math.cos(a)*(1.0+Math.random()*.8);pos.array[j+1]=Math.sin(a)*(1.0+Math.random()*.8)}else{pos.array[j]=Math.cos(a)*nr;pos.array[j+1]=Math.sin(a)*nr}}pos.needsUpdate=true;if(pulse>0){pulse=Math.max(0,pulse-.025);halo.scale.setScalar(1+(1-pulse)*.35);particleMat.opacity=.8+(1-pulse)*.5}else{halo.scale.setScalar(1);particleMat.opacity=.8}starField.rotation.y+=.00012;starMat.opacity=.72+Math.sin(time*1.4)*.12;camera.position.x=Math.sin(yaw)*Math.cos(pitch)*distance;camera.position.y=Math.sin(pitch)*distance;camera.position.z=Math.cos(yaw)*Math.cos(pitch)*distance;camera.lookAt(0,0,0);renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
