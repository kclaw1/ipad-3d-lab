<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Chatty Portal 💙</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.copy{position:fixed;z-index:3;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:12vh 8vw}.copy-inner{transform:translateY(-2vh);opacity:0;animation:arrive 1.4s .45s cubic-bezier(.2,.8,.2,1) forwards}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(220,248,255,.7);margin-bottom:14px}.title{font-size:clamp(46px,11vw,92px);line-height:.9;margin:0;font-weight:750;letter-spacing:-.055em;color:#f4fdff;text-shadow:0 8px 40px rgba(80,210,255,.22)}.sub{margin:18px 0 0;font-size:15px;color:rgba(225,247,255,.62);letter-spacing:.02em}.chatty{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(68px,15vw,126px);filter:drop-shadow(0 16px 30px rgba(72,207,255,.28));pointer-events:none;opacity:0;animation:chattyIn 1.5s 1.35s cubic-bezier(.16,1.3,.3,1) forwards}.hint{position:fixed;z-index:5;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(225,248,255,.52);font-size:12px;letter-spacing:.08em;white-space:nowrap;transition:opacity .5s}.hint.hidden{opacity:0}.badge{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;color:rgba(225,248,255,.62);font-size:12px;letter-spacing:.08em}.badge b{color:#b8efff;font-weight:600}@keyframes arrive{to{opacity:1;transform:translateY(-2vh)}}@keyframes chattyIn{0%{opacity:0;transform:translate(-50%,-43%) scale(.65)}65%{opacity:1;transform:translate(-50%,-54%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(prefers-reduced-motion:reduce){.copy-inner,.chatty{animation:none;opacity:1;transform:translate(-0,-2vh)}.chatty{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="badge"><b>CHATTY</b> · PORTAL</div>
<div class="copy"><div class="copy-inner"><div class="eyebrow">a little doorway to somewhere curious</div><h1 class="title">Hello, wonder.</h1><p class="sub">Come a little closer.</p></div></div>
<div class="chatty" aria-hidden="true">😁</div>
<div class="hint" id="hint">tap the portal · scroll to enter</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#app').appendChild(renderer.domElement);
const quad=new THREE.PlaneGeometry(2,2);
const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uResolution:{value:new THREE.Vector2(innerWidth,innerHeight)},uRipple:{value:0},uRippleAt:{value:new THREE.Vector2(.5,.5)},uScroll:{value:0}},vertexShader:`void main(){gl_Position=vec4(position,1.0);}`,fragmentShader:`
precision highp float;uniform float uTime,uRipple,uScroll;uniform vec2 uResolution,uRippleAt;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);} 
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);} 
float fbm(vec2 p){float v=0.;float a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(17.2,4.1);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/uResolution;uv.y=1.-uv.y;vec2 p=uv-.5;p.x*=uResolution.x/uResolution.y;float t=uTime*.055;float r=length(p);float a=atan(p.y,p.x);float breathing=1.+.018*sin(uTime*.62)+.012*sin(uTime*.31+2.);float wobble=fbm(vec2(cos(a)*3.+sin(a)*1.7+t,sin(a)*3.-cos(a)*1.3-t))*.11;float edge=.92*breathing+wobble;float ring=exp(-pow((r-edge)/.075,2.));float inner=exp(-pow((r-(edge-.10))/.19,2.));float mist=exp(-pow((r-(edge-.02))/.27,2.))*(.22+.78*fbm(p*3.1+vec2(t,-t*.7)));float wisps=pow(max(0.,sin(a*7.-uTime*.17+fbm(p*4.)*2.)),10.)*exp(-pow((r-edge)/.13,2.));vec2 q=p-uRippleAt;q.x*=uResolution.x/uResolution.y;float wave=sin(length(q)*44.-uTime*5.5)*exp(-length(q)*9.)*uRipple;float rippleMask=exp(-pow((r-edge)/.18,2.))*wave;vec3 bg=vec3(.027,.068,.115);bg+=vec3(.015,.045,.07)*smoothstep(.8,.1,r);vec3 cyan=vec3(.55,.88,1.);vec3 white=vec3(.9,.98,1.);float glow=ring*1.1+inner*.32+mist*.22+wisps*.35+rippleMask*.45;vec3 col=bg+cyan*glow+white*(ring*.28+wisps*.12);float alpha=clamp(glow*1.18,0.,1.)*smoothstep(1.5,.28,r);gl_FragColor=vec4(col,alpha);}`});
const portal=new THREE.Mesh(quad,material);scene.add(portal);
const count=28,pos=new Float32Array(count*3),sizes=new Float32Array(count);for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,r=.72+Math.random()*.48;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.sin(a)*r;pos[i*3+2]=0;sizes[i]=.5+Math.random()*1.6;}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));sg.setAttribute('size',new THREE.BufferAttribute(sizes,1));const sm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:`attribute float size;varying float vA;uniform float uTime;void main(){vec3 p=position;p.xy*=1.+.025*sin(uTime*.5+position.x*4.);vA=.35+.35*sin(uTime*.7+position.y*8.);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);gl_PointSize=size*2.2;}`,fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d)*vA;gl_FragColor=vec4(.72,.94,1.,a);}`});const sparks=new THREE.Points(sg,sm);scene.add(sparks);
let ripple=0,scroll=0;const hint=document.querySelector('#hint');function triggerRipple(x=.5,y=.5){material.uniforms.uRippleAt.value.set(x,y);ripple=1;hint.classList.add('hidden');}renderer.domElement.addEventListener('pointerdown',e=>triggerRipple(e.clientX/innerWidth,1-e.clientY/innerHeight));addEventListener('wheel',e=>{scroll=Math.min(1,scroll+Math.abs(e.deltaY)*.0015);material.uniforms.uScroll.value=scroll;hint.classList.add('hidden')},{passive:true});addEventListener('touchmove',()=>{scroll=Math.min(1,scroll+.01);material.uniforms.uScroll.value=scroll;hint.classList.add('hidden')},{passive:true});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);material.uniforms.uResolution.value.set(innerWidth,innerHeight);});const clock=new THREE.Clock();function animate(){const t=clock.getElapsedTime();material.uniforms.uTime.value=t;sm.uniforms.uTime.value=t;ripple*=.94;material.uniforms.uRipple.value=ripple;portal.scale.setScalar(1+scroll*.22);sparks.rotation.z=t*.006;renderer.render(scene,camera);}renderer.setAnimationLoop(animate);
</script>
</body></html>
