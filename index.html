<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Chatty Portal 💙</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.copy{position:fixed;z-index:3;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:12vh 8vw}.copy-inner{transform:translateY(-2vh);opacity:0;animation:arrive 1.4s .45s cubic-bezier(.2,.8,.2,1) forwards}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(220,248,255,.7);margin-bottom:14px}.title{font-size:clamp(46px,11vw,92px);line-height:.9;margin:0;font-weight:750;letter-spacing:-.055em;color:#f4fdff;text-shadow:0 8px 40px rgba(80,210,255,.22)}.sub{margin:18px 0 0;font-size:15px;color:rgba(225,247,255,.62);letter-spacing:.02em}.chatty{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(68px,15vw,126px);filter:drop-shadow(0 16px 30px rgba(72,207,255,.28));pointer-events:none;opacity:0;animation:chattyIn 1.5s 1.35s cubic-bezier(.16,1.3,.3,1) forwards}.hint{position:fixed;z-index:5;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(225,248,255,.52);font-size:12px;letter-spacing:.08em;white-space:nowrap;transition:opacity .5s}.hint.hidden{opacity:0}.badge{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;color:rgba(225,248,255,.62);font-size:12px;letter-spacing:.08em}.badge b{color:#b8efff;font-weight:600}@keyframes arrive{to{opacity:1;transform:translateY(-2vh)}}@keyframes chattyIn{0%{opacity:0;transform:translate(-50%,-43%) scale(.65)}65%{opacity:1;transform:translate(-50%,-54%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(prefers-reduced-motion:reduce){.copy-inner,.chatty{animation:none;opacity:1;transform:translate(-0,-2vh)}.chatty{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div id="app"></div><div class="badge"><b>CHATTY</b> · PORTAL</div><div class="copy"><div class="copy-inner"><div class="eyebrow">a little doorway to somewhere curious</div><h1 class="title">Hello, wonder.</h1><p class="sub">Come a little closer.</p></div></div><div class="chatty" aria-hidden="true">😁</div><div class="hint" id="hint">tap the portal · swipe to enter</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#app').appendChild(renderer.domElement);
const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uAspect:{value:innerWidth/innerHeight},uRipple:{value:0},uRippleAt:{value:new THREE.Vector2(.5,.5)},uOpen:{value:0}},vertexShader:`void main(){gl_Position=vec4(position,1.0);}`,fragmentShader:`
precision highp float;uniform float uTime,uAspect,uRipple,uOpen;uniform vec2 uRippleAt;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.02+vec2(8.7,3.1);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/vec2(1.0);uv.y=1.-uv.y;vec2 p=uv-.5;p.x*=uAspect;float r=length(p),a=atan(p.y,p.x),t=uTime*.055;
float n=fbm(vec2(cos(a)*3.8+sin(a)*1.9+t*1.3,sin(a)*3.8-cos(a)*1.5-t));
float n2=fbm(p*5.2+vec2(-t*1.8,t*.9));
float edge=1.00+.045*sin(a*3.+uTime*.28)+.025*sin(a*8.-uTime*.19)+(.09*n-.045)*smoothstep(.2,.9,r);
float d=r-edge;
float field=exp(-pow(d/.055,2.));
float outer=exp(-pow((d-.035)/.13,2.))*(.22+.78*n2);
float inner=exp(-pow((d+.10)/.22,2.))*(.12+.88*fbm(p*3.8+vec2(t,-t*.7)));
float flow=pow(max(0.,sin(a*11.-uTime*.34+n*8.)),13.)*exp(-pow(d/.12,2.));
float flow2=pow(max(0.,sin(a*5.+uTime*.18-n*6.)),18.)*exp(-pow((d+.01)/.09,2.));
float filaments=(flow+flow2)*(.35+.65*n2);
vec2 q=p-uRippleAt;float rq=length(q);float wave=sin(rq*48.-uTime*6.5)*exp(-rq*8.)*uRipple;float ripple=wave*exp(-pow(d/.16,2.));
float breath=.92+.12*sin(uTime*.62)+.05*sin(uTime*.31+1.7);float energy=field*1.15+outer*.65+inner*.42+filaments*.75+ripple*.7;
energy*=breath*(1.+uOpen*.18);
vec3 bg=vec3(.027,.068,.115)+vec3(.012,.028,.05)*smoothstep(.9,.05,r);vec3 cyan=vec3(.38,.82,1.);vec3 ice=vec3(.88,.98,1.);vec3 col=bg+cyan*energy+ice*(field*.32+filaments*.18);
float alpha=clamp(energy*1.05,0.,1.)*smoothstep(1.5,.25,r);gl_FragColor=vec4(col,alpha);}`});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);scene.add(quad);
const count=34,pos=new Float32Array(count*3),sizes=new Float32Array(count);for(let i=0;i<count;i++){let a=Math.random()*6.283,r=.68+Math.random()*.5;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.sin(a)*r;pos[i*3+2]=0;sizes[i]=.55+Math.random()*1.8}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));sg.setAttribute('size',new THREE.BufferAttribute(sizes,1));const sm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:`attribute float size;varying float vA;uniform float uTime;void main(){vec3 p=position;p.xy*=1.+.025*sin(uTime*.5+position.x*4.);vA=.3+.4*sin(uTime*.7+position.y*8.);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);gl_PointSize=size*2.4;}`,fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(.72,.94,1.,smoothstep(.5,0.,d)*vA);}`});const sparks=new THREE.Points(sg,sm);scene.add(sparks);
let ripple=0,open=0;const hint=document.querySelector('#hint');function triggerRipple(x=.5,y=.5){material.uniforms.uRippleAt.value.set(x,y);ripple=1;hint.classList.add('hidden')}
let downY=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{downY=lastY=e.clientY;triggerRipple(e.clientX/innerWidth,1-e.clientY/innerHeight);});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons){let dy=lastY-e.clientY;if(Math.abs(e.clientY-downY)>8){open=THREE.MathUtils.clamp(open+dy*.002,0,1);material.uniforms.uOpen.value=open;hint.classList.add('hidden')}lastY=e.clientY;}});
addEventListener('wheel',e=>{open=THREE.MathUtils.clamp(open+Math.abs(e.deltaY)*.0018,0,1);material.uniforms.uOpen.value=open;hint.classList.add('hidden')},{passive:true});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);material.uniforms.uAspect.value=innerWidth/innerHeight});
const clock=new THREE.Clock();function animate(){let t=clock.getElapsedTime();material.uniforms.uTime.value=t;sm.uniforms.uTime.value=t;ripple*=.94;material.uniforms.uRipple.value=ripple;quad.scale.setScalar(1+open*.24);sparks.rotation.z=t*.006;renderer.render(scene,camera)}renderer.setAnimationLoop(animate);
</script></body></html>
