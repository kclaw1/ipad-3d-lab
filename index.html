<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Chatty Portal 💙</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{touch-action:none}#app,canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.copy{position:fixed;z-index:3;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:12vh 8vw}.copy-inner{transform:translateY(-2vh);opacity:0;animation:arrive 1.4s .45s cubic-bezier(.2,.8,.2,1) forwards}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(220,248,255,.7);margin-bottom:14px}.title{font-size:clamp(46px,11vw,92px);line-height:.9;margin:0;font-weight:750;letter-spacing:-.055em;color:#f4fdff;text-shadow:0 8px 40px rgba(80,210,255,.22)}.sub{margin:18px 0 0;font-size:15px;color:rgba(225,247,255,.62)}.chatty{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(68px,15vw,126px);filter:drop-shadow(0 16px 30px rgba(72,207,255,.28));pointer-events:none;opacity:0;animation:chattyIn 1.5s 1.35s cubic-bezier(.16,1.3,.3,1) forwards}.hint{position:fixed;z-index:5;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(225,248,255,.52);font-size:12px;letter-spacing:.08em;white-space:nowrap}.hint.hidden{opacity:0}.badge{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;color:rgba(225,248,255,.62);font-size:12px;letter-spacing:.08em}.badge b{color:#b8efff;font-weight:600}@keyframes arrive{to{opacity:1;transform:translateY(-2vh)}}@keyframes chattyIn{0%{opacity:0;transform:translate(-50%,-43%) scale(.65)}65%{opacity:1;transform:translate(-50%,-54%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}</style></head>
<body><div id="app"></div><div class="badge"><b>CHATTY</b> · PORTAL</div><div class="copy"><div class="copy-inner"><div class="eyebrow">a little doorway to somewhere curious</div><h1 class="title">Hello, wonder.</h1><p class="sub">Come a little closer.</p></div></div><div class="chatty" aria-hidden="true">😁</div><div class="hint" id="hint">tap the portal · swipe to enter</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#app').appendChild(renderer.domElement);
const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uResolution:{value:new THREE.Vector2(innerWidth,innerHeight)},uRipple:{value:0},uRippleAt:{value:new THREE.Vector2(.5,.5)},uOpen:{value:0}},vertexShader:`void main(){gl_Position=vec4(position,1.0);}`,fragmentShader:`precision highp float;uniform float uTime,uRipple,uOpen;uniform vec2 uResolution,uRippleAt;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.02+vec2(8.7,3.1);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/uResolution;uv.y=1.-uv.y;vec2 p=uv-.5;p.x*=uResolution.x/uResolution.y;float r=length(p),a=atan(p.y,p.x),t=uTime;
float n=fbm(vec2(cos(a)*4.0+sin(a)*2.0+t*.10,sin(a)*4.0-cos(a)*1.6-t*.075));float n2=fbm(p*5.5+vec2(-t*.12,t*.08));
float edge=1.00+.075*sin(a*3.0+t*.55)+.045*sin(a*7.0-t*.32)+.025*sin(a*15.0+t*.21)+(.12*n-.06);float d=r-edge;
float core=exp(-pow(d/.035,2.));float aura=exp(-pow(d/.13,2.));float mist=exp(-pow((d+.02)/.30,2.))*(.35+.65*n2);
float stream=sin(a*13.0-t*1.35+n*7.0)+sin(a*23.0+t*.8-n2*8.0);stream=pow(max(0.,stream*.28+.45),7.0)*aura;
float stream2=pow(max(0.,sin(a*5.0+t*.55+n*5.)),9.0)*exp(-pow((d-.01)/.10,2.));
float tendrils=(stream+stream2)*(.45+.55*n2);
vec2 q=p-uRippleAt;float rq=length(q);float wave=sin(rq*55.-t*8.)*exp(-rq*10.)*uRipple;float ripple=wave*exp(-pow(d/.15,2.));
float breath=.94+.10*sin(t*.7)+.035*sin(t*.31);float energy=(core*1.8+aura*.62+mist*.45+tendrils*1.4+ripple*.9)*breath*(1.+uOpen*.12);
vec3 bg=vec3(.027,.068,.115)+vec3(.012,.032,.055)*smoothstep(.9,.05,r);vec3 cyan=vec3(.25,.78,1.);vec3 ice=vec3(.72,.96,1.);vec3 col=bg+cyan*energy+ice*(core*.18+tendrils*.10);float alpha=clamp(energy*1.18,0.,1.)*smoothstep(1.55,.22,r);gl_FragColor=vec4(col,alpha);}`});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);scene.add(quad);
const count=40,pos=new Float32Array(count*3),sizes=new Float32Array(count);for(let i=0;i<count;i++){let a=Math.random()*6.283,r=.72+Math.random()*.52;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.sin(a)*r;pos[i*3+2]=0;sizes[i]=.5+Math.random()*1.8}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));sg.setAttribute('size',new THREE.BufferAttribute(sizes,1));const sm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:`attribute float size;varying float vA;uniform float uTime;void main(){vec3 p=position;p.xy*=1.+.025*sin(uTime*.5+position.x*4.);vA=.3+.4*sin(uTime*.7+position.y*8.);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);gl_PointSize=size*2.4;}`,fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(.65,.92,1.,smoothstep(.5,0.,d)*vA);}`});const sparks=new THREE.Points(sg,sm);scene.add(sparks);
let ripple=0,open=0,downY=0,lastY=0,drag=false;const hint=document.querySelector('#hint');function triggerRipple(x=.5,y=.5){material.uniforms.uRippleAt.value.set(x,y);ripple=1;hint.classList.add('hidden')}
renderer.domElement.addEventListener('pointerdown',e=>{downY=lastY=e.clientY;drag=true;triggerRipple(e.clientX/innerWidth,1-e.clientY/innerHeight)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let dy=lastY-e.clientY;if(Math.abs(e.clientY-downY)>5){open=THREE.MathUtils.clamp(open+dy*.003,0,1);material.uniforms.uOpen.value=open;hint.classList.add('hidden')}lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
addEventListener('wheel',e=>{open=THREE.MathUtils.clamp(open+Math.abs(e.deltaY)*.002,0,1);material.uniforms.uOpen.value=open;hint.classList.add('hidden')},{passive:true});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);material.uniforms.uResolution.value.set(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){let t=clock.getElapsedTime();material.uniforms.uTime.value=t;material.uniforms.uRipple.value=ripple;ripple*=.94;quad.scale.setScalar(1+open*.24);sparks.rotation.z=t*.008;renderer.render(scene,camera)}renderer.setAnimationLoop(animate);
</script></body></html>
