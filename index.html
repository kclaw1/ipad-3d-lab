<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>3D Blob Lab 🫧</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090d;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #controls {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;

      padding: 15px;

      background: rgba(20, 20, 28, 0.78);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;

      color: white;
      z-index: 10;
    }

    .row {
      margin-bottom: 13px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 10px 4px;

      background: rgba(255,255,255,0.1);
      color: white;

      font-size: 12px;
    }

    button:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.22);
    }

    .hint {
      text-align: center;
      opacity: 0.5;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="app"></div>

<div id="controls">

  <!-- ROUGHNESS -->

  <div class="row">

    <label>
      <span>Roughness</span>
      <span id="roughnessValue">0.25</span>
    </label>

    <input
      id="roughness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.25"
    >

  </div>


  <!-- METALNESS -->

  <div class="row">

    <label>
      <span>Metalness</span>
      <span id="metalnessValue">0.35</span>
    </label>

    <input
      id="metalness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.35"
    >

  </div>


  <!-- BLOBINESS -->

  <div class="row">

    <label>
      <span>Blobiness 🫠</span>
      <span id="blobValue">0.25</span>
    </label>

    <input
      id="blobiness"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.25"
    >

  </div>


  <!-- COLOR -->

  <div class="row">

    <button id="colorButton">
      🎨 Change Color
    </button>

  </div>


  <!-- GEOMETRY -->

  <div class="row">

    <label>
      <span>Shape</span>
    </label>

    <div class="buttons">

      <button data-shape="cube">
        Cube
      </button>

      <button data-shape="sphere">
        Sphere
      </button>

      <button data-shape="torus">
        Torus
      </button>

      <button data-shape="blob">
        🫧 Blob
      </button>

    </div>

  </div>


  <div class="hint">
    👆 Drag = rotate &nbsp; • &nbsp; 🤏 Pinch = zoom
  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";


// ============================================================
// SCENE
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x09090d);


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
  );

camera.position.z = 4;


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.domElement.style.touchAction =
  "none";

document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  );


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(
  ambientLight
);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    4
  );

keyLight.position.set(
  3,
  4,
  5
);

scene.add(
  keyLight
);


const fillLight =
  new THREE.DirectionalLight(
    0x6688ff,
    2
  );

fillLight.position.set(
  -4,
  -2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MATERIAL
// ============================================================

const material =
  new THREE.MeshStandardMaterial({

    color: 0xff66cc,

    metalness: 0.35,

    roughness: 0.25

  });


// ============================================================
// BLOB GEOMETRY
// ============================================================

function createBlob() {

  const geometry =
    new THREE.SphereGeometry(
      1.1,
      96,
      96
    );

  const position =
    geometry.attributes.position;


  // Save original vertices

  const original =
    position.array.slice();


  geometry.userData.original =
    original;


  return geometry;

}


// ============================================================
// GEOMETRY CREATOR
// ============================================================

function createGeometry(
  type
) {

  switch (type) {

    case "cube":

      return new THREE.BoxGeometry(
        1.6,
        1.6,
        1.6
      );


    case "sphere":

      return new THREE.SphereGeometry(
        1.1,
        64,
        64
      );


    case "torus":

      return new THREE.TorusGeometry(
        1,
        0.35,
        32,
        100
      );


    case "blob":

      return createBlob();

  }

}


// ============================================================
// OBJECT
// ============================================================

let currentShape =
  "blob";

let geometry =
  createGeometry(
    currentShape
  );

let object =
  new THREE.Mesh(
    geometry,
    material
  );

scene.add(
  object
);


// ============================================================
// BLOB SETTINGS
// ============================================================

let blobiness =
  0.25;

let time = 0;


// ============================================================
// DEFORM BLOB
// ============================================================

function deformBlob() {

  if (
    currentShape !== "blob"
  ) return;


  const position =
    object.geometry
      .attributes
      .position;

  const original =
    object.geometry
      .userData
      .original;


  for (
    let i = 0;
    i < position.count;
    i++
  ) {

    const x =
      original[i * 3];

    const y =
      original[i * 3 + 1];

    const z =
      original[i * 3 + 2];


    // Distance from center

    const length =
      Math.sqrt(
        x*x +
        y*y +
        z*z
      );


    // Normalized direction

    const nx =
      x / length;

    const ny =
      y / length;

    const nz =
      z / length;


    // Organic noise

    const wave =
      Math.sin(
        x * 3 +
        time
      )
      *
      Math.cos(
        y * 2.5 +
        time * 0.7
      )
      *
      Math.sin(
        z * 2 +
        time * 0.5
      );


    const amount =
      1 +
      wave *
      blobiness *
      0.35;


    position.setXYZ(
      i,

      nx * length * amount,

      ny * length * amount,

      nz * length * amount

    );

  }


  position.needsUpdate =
    true;

  object.geometry
    .computeVertexNormals();

}


// ============================================================
// ROUGHNESS
// ============================================================

const roughnessSlider =
  document.getElementById(
    "roughness"
  );

const roughnessValue =
  document.getElementById(
    "roughnessValue"
  );


roughnessSlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        roughnessSlider.value
      );

    material.roughness =
      value;

    roughnessValue.textContent =
      value.toFixed(2);

  }
);


// ============================================================
// METALNESS
// ============================================================

const metalnessSlider =
  document.getElementById(
    "metalness"
  );

const metalnessValue =
  document.getElementById(
    "metalnessValue"
  );


metalnessSlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        metalnessSlider.value
      );

    material.metalness =
      value;

    metalnessValue.textContent =
      value.toFixed(2);

  }
);


// ============================================================
// BLOBINESS
// ============================================================

const blobSlider =
  document.getElementById(
    "blobiness"
  );

const blobValue =
  document.getElementById(
    "blobValue"
  );


blobSlider.addEventListener(
  "input",
  () => {

    blobiness =
      Number(
        blobSlider.value
      );

    blobValue.textContent =
      blobiness.toFixed(2);

  }
);


// ============================================================
// COLORS
// ============================================================

const colors = [

  0xff66cc,
  0x66ddff,
  0x9966ff,
  0xffcc66,
  0x66ff99,
  0xff6677,
  0xffffff

];

let colorIndex = 0;


document
  .getElementById(
    "colorButton"
  )
  .addEventListener(
    "click",
    () => {

      colorIndex =
        (
          colorIndex + 1
        )
        %
        colors.length;

      material.color.setHex(
        colors[colorIndex]
      );

    }
  );


// ============================================================
// SHAPE BUTTONS
// ============================================================

document
  .querySelectorAll(
    "[data-shape]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const type =
            button.dataset.shape;


          const newGeometry =
            createGeometry(
              type
            );


          object.geometry
            .dispose();


          object.geometry =
            newGeometry;


          currentShape =
            type;

        }
      );

    }
  );


// ============================================================
// POINTER ROTATION
// ============================================================

let isDragging =
  false;

let previousX = 0;
let previousY = 0;


renderer.domElement
  .addEventListener(
    "pointerdown",
    event => {

      isDragging =
        true;

      previousX =
        event.clientX;

      previousY =
        event.clientY;

      renderer.domElement
        .setPointerCapture(
          event.pointerId
        );

    }
  );


renderer.domElement
  .addEventListener(
    "pointermove",
    event => {

      if (
        !isDragging
      ) return;


      const deltaX =
        event.clientX -
        previousX;

      const deltaY =
        event.clientY -
        previousY;


      object.rotation.y +=
        deltaX * 0.01;

      object.rotation.x +=
        deltaY * 0.01;


      previousX =
        event.clientX;

      previousY =
        event.clientY;

    }
  );


renderer.domElement
  .addEventListener(
    "pointerup",
    event => {

      isDragging =
        false;

      renderer.domElement
        .releasePointerCapture(
          event.pointerId
        );

    }
  );


// ============================================================
// PINCH ZOOM
// ============================================================

const activePointers =
  new Map();


let pinchDistance = null;


renderer.domElement
  .addEventListener(
    "pointerdown",
    event => {

      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );

      if (
        activePointers.size === 2
      ) {

        const points =
          [...activePointers.values()];

        pinchDistance =
          distance(
            points[0],
            points[1]
          );

        isDragging =
          false;

      }

    }
  );


renderer.domElement
  .addEventListener(
    "pointermove",
    event => {

      if (
        !activePointers.has(
          event.pointerId
        )
      ) return;


      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );


      if (
        activePointers.size !== 2
      ) return;


      const points =
        [...activePointers.values()];


      const newDistance =
        distance(
          points[0],
          points[1]
        );


      if (
        pinchDistance !== null
      ) {

        const delta =
          newDistance -
          pinchDistance;


        camera.position.z -=
          delta * 0.01;


        camera.position.z =
          THREE.MathUtils.clamp(
            camera.position.z,
            2,
            8
          );

      }


      pinchDistance =
        newDistance;

    }
  );


function distance(
  a,
  b
) {

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


renderer.domElement
  .addEventListener(
    "pointerup",
    event => {

      activePointers.delete(
        event.pointerId
      );

      if (
        activePointers.size < 2
      ) {

        pinchDistance =
          null;

      }

    }
  );


renderer.domElement
  .addEventListener(
    "pointercancel",
    event => {

      activePointers.delete(
        event.pointerId
      );

      pinchDistance =
        null;

    }
  );


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  time += 0.025;

  deformBlob();

  renderer.render(
    scene,
    camera
  );

}


renderer.setAnimationLoop(
  animate
);

</script>

</body>
</html>
