<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>3D Type Lab 🔤</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050510;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#loading{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:9px 14px;background:rgba(20,20,30,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:white;font-size:12px;z-index:20;transition:opacity .3s}#controls{position:fixed;left:14px;right:14px;bottom:14px;max-height:58vh;overflow-y:auto;padding:15px;background:rgba(20,20,28,.78);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:white;z-index:10}.row{margin-bottom:13px}.row:last-child{margin-bottom:0}label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}input[type=range]{width:100%}input[type=text]{width:100%;padding:11px;border:0;border-radius:11px;background:rgba(255,255,255,.1);color:white;font-size:16px;outline:none}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}button{border:0;border-radius:11px;padding:10px 4px;background:rgba(255,255,255,.1);color:white;font-size:12px}button:active{transform:scale(.96);background:rgba(255,255,255,.22)}button.active{background:rgba(255,255,255,.25)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:10px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script></head><body><div id="app"></div><div id="loading">🔤 Loading Type Lab...</div><div id="controls"><div class="row"><label><span>Text 🔤</span></label><input id="textInput" type="text" value="HELLO" maxlength="18"></div><div class="row"><label><span>Depth</span><span id="depthValue">0.35</span></label><input id="depth" type="range" min="0.05" max="1" step="0.01" value="0.35"></div><div class="row"><label><span>Roundness 🫧</span><span id="bevelValue">0.08</span></label><input id="bevel" type="range" min="0" max="0.25" step="0.01" value="0.08"></div><div class="row"><label><span>Roughness</span><span id="roughnessValue">0.25</span></label><input id="roughness" type="range" min="0" max="1" step="0.01" value="0.25"></div><div class="row"><label><span>Metalness</span><span id="metalnessValue">0.35</span></label><input id="metalness" type="range" min="0" max="1" step="0.01" value="0.35"></div><div class="row"><button id="colorButton">🎨 Change Color</button></div><div class="row"><label><span>Camera 🎥</span></label><div class="buttons"><button data-camera="object">Object</button><button data-camera="orbit">Orbit</button><button data-camera="cinematic" class="active">Cinema</button><button data-camera="parallax">Float</button></div></div><div class="hint">👆 Drag = rotate & squish • 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "three";import {FontLoader} from "three/addons/loaders/FontLoader.js";import {TextGeometry} from "three/addons/geometries/TextGeometry.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x050510);scene.fog=new THREE.FogExp2(0x080820,.018);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);let cameraDistance=5,cameraMode="cinematic",cameraYaw=0,cameraPitch=0,targetCameraX=0,targetCameraY=0;camera.position.set(0,0,5);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,1.5));const key=new THREE.DirectionalLight(0xffffff,4);key.position.set(3,4,5);scene.add(key);const fill=new THREE.DirectionalLight(0x6688ff,2);fill.position.set(-4,-2,3);scene.add(fill);const starGeometry=new THREE.BufferGeometry(),starPositions=[];for(let i=0;i<1100;i++){const r=7+Math.random()*18,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);starPositions.push(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi))}starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.055,sizeAttenuation:true,transparent:true,opacity:.9,depthWrite:false}));scene.add(stars);const material=new THREE.MeshStandardMaterial({color:0xff66cc,metalness:.35,roughness:.25});let font=null,textMesh=null,textDepth=.35,textBevel=.08,time=0;let deformPositions=null,deformVelocity=null;const loading=document.getElementById("loading");new FontLoader().load("https://cdn.jsdelivr.net/npm/three@0.179.1/examples/fonts/helvetiker_bold.typeface.json",f=>{font=f;loading.textContent="✨ Type Lab ready";setTimeout(()=>loading.style.opacity="0",800);createText()},undefined,e=>{console.error(e);loading.textContent="❌ Font failed to load"});function createText(){if(!font)return;const text=document.getElementById("textInput").value.trim().toUpperCase();if(!text)return;const geometry=new TextGeometry(text,{font,size:1,depth:textDepth,curveSegments:12,bevelEnabled:textBevel>0,bevelThickness:textBevel,bevelSize:textBevel,bevelOffset:0,bevelSegments:5});geometry.computeBoundingBox();const box=geometry.boundingBox,width=box.max.x-box.min.x;geometry.translate(-(box.max.x+box.min.x)/2,-(box.max.y+box.min.y)/2,-textDepth/2);const scale=Math.min(1,3.6/width);if(textMesh){scene.remove(textMesh);textMesh.geometry.dispose()}textMesh=new THREE.Mesh(geometry,material);textMesh.userData.baseScale=scale;textMesh.scale.setScalar(scale);scene.add(textMesh);const p=geometry.attributes.position;deformPositions=new Float32Array(p.array);deformVelocity=new Float32Array(p.count*3)}document.getElementById("textInput").addEventListener("input",createText);const depth=document.getElementById("depth"),depthValue=document.getElementById("depthValue");depth.addEventListener("input",()=>{textDepth=Number(depth.value);depthValue.textContent=textDepth.toFixed(2);createText()});const bevel=document.getElementById("bevel"),bevelValue=document.getElementById("bevelValue");bevel.addEventListener("input",()=>{textBevel=Number(bevel.value);bevelValue.textContent=textBevel.toFixed(2);createText()});const roughness=document.getElementById("roughness"),roughnessValue=document.getElementById("roughnessValue");roughness.addEventListener("input",()=>{material.roughness=Number(roughness.value);roughnessValue.textContent=Number(roughness.value).toFixed(2)});const metalness=document.getElementById("metalness"),metalnessValue=document.getElementById("metalnessValue");metalness.addEventListener("input",()=>{material.metalness=Number(metalness.value);metalnessValue.textContent=Number(metalness.value).toFixed(2)});const colors=[0xff66cc,0x66ddff,0x9966ff,0xffcc66,0x66ff99,0xff6677,0xffffff];let colorIndex=0;document.getElementById("colorButton").addEventListener("click",()=>{colorIndex=(colorIndex+1)%colors.length;material.color.setHex(colors[colorIndex])});document.querySelectorAll("[data-camera]").forEach(button=>button.addEventListener("click",()=>{cameraMode=button.dataset.camera;document.querySelectorAll("[data-camera]").forEach(b=>b.classList.remove("active"));button.classList.add("active");if(cameraMode==="orbit"){const r=Math.max(2,cameraDistance);cameraYaw=Math.atan2(camera.position.x,camera.position.z);cameraPitch=Math.asin(THREE.MathUtils.clamp(camera.position.y/r,-1,1))}}));const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();const activePointers=new Map();let pinchDistance=null,previousX=0,previousY=0;function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function localHit(x,y){if(!textMesh)return null;pointer.x=x/innerWidth*2-1;pointer.y=-(y/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(textMesh,false);if(!hits.length)return null;return textMesh.worldToLocal(hits[0].point.clone())}function pokeText(localPoint,dx,dy){if(!textMesh||!deformPositions||!deformVelocity||!localPoint)return;const p=textMesh.geometry.attributes.position;const radius=.65;const strength=Math.min(0.12,Math.hypot(dx,dy)*.004+.018);for(let i=0;i<p.count;i++){const ix=i*3,px=deformPositions[ix],py=deformPositions[ix+1],pz=deformPositions[ix+2];const ddx=px-localPoint.x,ddy=py-localPoint.y,ddz=pz-localPoint.z;const d=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz);if(d<radius){const fall=Math.pow(1-d/radius,2);deformVelocity[ix]+=dx*.012*fall;deformVelocity[ix+1]+=-dy*.012*fall;deformVelocity[ix+2]+=strength*fall}}}renderer.domElement.addEventListener("pointerdown",e=>{activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(activePointers.size===1){previousX=e.clientX;previousY=e.clientY}else if(activePointers.size===2){const p=[...activePointers.values()];pinchDistance=distance(p[0],p[1])}});renderer.domElement.addEventListener("pointermove",e=>{if(!activePointers.has(e.pointerId))return;const old=activePointers.get(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){const p=[...activePointers.values()],d=distance(p[0],p[1]);if(pinchDistance!==null)cameraDistance=THREE.MathUtils.clamp(cameraDistance-(d-pinchDistance)*.01,2,9);pinchDistance=d;return}const dx=e.clientX-old.x,dy=e.clientY-old.y;const hit=localHit(e.clientX,e.clientY);pokeText(hit,dx,dy);if(cameraMode==="object"&&textMesh){textMesh.rotation.y+=dx*.01;textMesh.rotation.x+=dy*.01}if(cameraMode==="orbit"){cameraYaw+=dx*.01;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.005,-1.2,1.2)}if(cameraMode==="parallax"){targetCameraX=THREE.MathUtils.clamp(targetCameraX+dx*.018,-1.2,1.2);targetCameraY=THREE.MathUtils.clamp(targetCameraY-dy*.018,-.8,.8)}previousX=e.clientX;previousY=e.clientY});function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size<2)pinchDistance=null}renderer.domElement.addEventListener("pointerup",endPointer);renderer.domElement.addEventListener("pointercancel",endPointer);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){time+=.025;if(textMesh&&deformPositions&&deformVelocity){const p=textMesh.geometry.attributes.position;for(let i=0;i<p.count;i++){const ix=i*3;for(let a=0;a<3;a++){const j=ix+a;const delta=deformPositions[j]-p.array[j];deformVelocity[j]+=delta*.08;deformVelocity[j]*=.78;p.array[j]+=deformVelocity[j]}}p.needsUpdate=true;textMesh.geometry.computeVertexNormals()}stars.rotation.y+=.00025;stars.material.opacity=.72+Math.sin(time*1.7)*.18;if(cameraMode==="cinematic"){const x=Math.sin(time*.45)*1.35,y=Math.sin(time*.31)*.6,z=cameraDistance+Math.sin(time*.22)*.75;camera.position.x+=(x-camera.position.x)*.035;camera.position.y+=(y-camera.position.y)*.035;camera.position.z+=(z-camera.position.z)*.035;camera.lookAt(0,.12,0)}if(cameraMode==="parallax"){const x=targetCameraX*2.2,y=targetCameraY*1.6;camera.position.x+=(x-camera.position.x)*.08;camera.position.y+=(y-camera.position.y)*.08;camera.position.z+=(cameraDistance-camera.position.z)*.08;camera.lookAt(0,0,0)}if(cameraMode==="orbit"){const r=cameraDistance;camera.position.x=Math.sin(cameraYaw)*Math.cos(cameraPitch)*r;camera.position.y=Math.sin(cameraPitch)*r;camera.position.z=Math.cos(cameraYaw)*Math.cos(cameraPitch)*r;camera.lookAt(0,0,0)}if(cameraMode==="object"){camera.position.x+=(0-camera.position.x)*.08;camera.position.y+=(0-camera.position.y)*.08;camera.position.z+=(cameraDistance-camera.position.z)*.08;camera.lookAt(0,0,0)}renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
