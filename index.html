<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Portal Lab 🌌</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{width:100%;height:100%}canvas{display:block;touch-action:none}#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;background:rgba(8,9,20,.58);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;z-index:10}.row{margin-bottom:12px}.row:last-child{margin:0}label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:0;border-radius:11px;padding:11px 5px;background:rgba(255,255,255,.1);color:#fff;font-size:12px}button:active{transform:scale(.97);background:rgba(255,255,255,.2)}.hint{text-align:center;opacity:.5;font-size:11px;margin-top:9px}</style></head><body><div id="app"></div><div id="controls"><div class="row"><label><span>Energy</span><span id="energyValue">0.72</span></label><input id="energy" type="range" min="0" max="1" step=".01" value=".72"></div><div class="row"><label><span>Portal Size</span><span id="sizeValue">1.35</span></label><input id="size" type="range" min=".7" max="2.2" step=".01" value="1.35"></div><div class="row"><div class="buttons"><button id="open">🌀 Open</button><button id="pulse">✨ Pulse</button><button id="reset">↩︎ Reset</button></div></div><div class="hint">👆 Drag = look around &nbsp; • &nbsp; 🤏 Pinch = zoom</div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";const scene=new THREE.Scene();scene.background=new THREE.Color(0x010208);scene.fog=new THREE.FogExp2(0x040714,.016);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);let distance=5,yaw=0,pitch=0;const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction="none";document.getElementById("app").appendChild(renderer.domElement);const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<2100;i++){const r=8+Math.random()*25,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);stars.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p))}starsGeo.setAttribute("position",new THREE.Float32BufferAttribute(stars,3));const starMat=new THREE.PointsMaterial({color:0xffffff,size:.042,sizeAttenuation:true,transparent:true,opacity:.8,depthWrite:false});scene.add(new THREE.Points(starsGeo,starMat));const portal=new THREE.Group();scene.add(portal);const voidMat=new THREE.MeshBasicMaterial({color:0x000108,transparent:true,opacity:.98,side:THREE.DoubleSide});const voidMesh=new THREE.Mesh(new THREE.CircleGeometry(1.15,128),voidMat);voidMesh.position.z=.08;portal.add(voidMesh);const rimMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uEnergy:{value:.72},uOpen:{value:0},uPulse:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime,uEnergy,uOpen,uPulse;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.-1.;float r=length(p),a=atan(p.y,p.x);float n=noise(vec2(a*2.8+uTime*.22,r*4.-uTime*.35));float n2=noise(vec2(a*6.-uTime*.8,r*9.+uTime*.45));float center=.72+.075*n+.028*n2;float d=abs(r-center);float body=smoothstep(.13,.015,d);float soft=smoothstep(.24,.035,d);float head=pow(max(0.,sin(a-uTime*1.05)*.5+.5),7.);float wake=pow(max(0.,sin(a-uTime*1.05-.55)*.5+.5),4.);float alpha=(body*(.34+.8*uEnergy)+soft*.24+head*.8+wake*.22)*uOpen;vec3 energy=vec3(.55,.66,1.0);energy+=vec3(.35)*head;energy+=vec3(.22)*soft;gl_FragColor=vec4(energy,alpha);}`});const rim=new THREE.Mesh(new THREE.PlaneGeometry(3.5,3.5),rimMat);rim.position.z=.12;portal.add(rim);const glowMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uEnergy:{value:.72},uOpen:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime,uEnergy,uOpen;float hash(vec2 p){return fract(sin(dot(p,vec2(19.2,71.3)))*43758.5);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=vUv*2.-1.;float r=length(p),a=atan(p.y,p.x);float n=noise(vec2(a*3.+uTime*.2,r*5.-uTime*.3));float b=.72+.08*n;float d=abs(r-b);float g=exp(-d*15.)*.45+exp(-d*38.)*.2;float head=pow(max(0.,sin(a-uTime*1.05)*.5+.5),9.);g+=head*.25;vec3 c=vec3(.32,.46,1.);gl_FragColor=vec4(c,g*(.25+uEnergy*.75)*uOpen);}`});const glow=new THREE.Mesh(new THREE.PlaneGeometry(4.1,4.1),glowMat);glow.position.z=.02;portal.add(glow);const trailGroup=new THREE.Group();portal.add(trailGroup);const trailCount=24;const trails=[];for(let i=0;i<trailCount;i++){const pts=new Float32Array(18*3);const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pts,3));const m=new THREE.LineBasicMaterial({color:0xcbd8ff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});const line=new THREE.Line(g,m);line.userData={phase:Math.random()*Math.PI*2,speed:.55+Math.random()*.55,len:.16+Math.random()*.28,r:.69+Math.random()*.05};trailGroup.add(line);trails.push(line)}const energy=document.getElementById("energy"),energyValue=document.getElementById("energyValue"),size=document.getElementById("size"),sizeValue=document.getElementById("sizeValue");let energyNum=.72,sizeNum=1.35;energy.addEventListener("input",()=>{energyNum=+energy.value;energyValue.textContent=energyNum.toFixed(2)});size.addEventListener("input",()=>{sizeNum=+size.value;sizeValue.textContent=sizeNum.toFixed(2)});let opening=0,pulse=0;document.getElementById("open").onclick=()=>opening=opening<.5?1:0;document.getElementById("pulse").onclick=()=>pulse=1;document.getElementById("reset").onclick=()=>{opening=0;pulse=0};const active=new Map();let pinch=null;renderer.domElement.addEventListener("pointerdown",e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(active.size===2){const a=[...active.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener("pointermove",e=>{if(!active.has(e.pointerId))return;const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const a=[...active.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch!==null)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.01,2.2,10);pinch=d;return}yaw+=(e.clientX-old.x)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-old.y)*.006,-1.2,1.2)});function end(e){active.delete(e.pointerId);if(active.size<2)pinch=null}renderer.domElement.addEventListener("pointerup",end);renderer.domElement.addEventListener("pointercancel",end);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let time=0;function animate(){time+=.016;const o=THREE.MathUtils.damp(portal.userData.o||0,opening,3.2,.016);portal.userData.o=o;portal.scale.setScalar((.72+.28*o)*(sizeNum/1.35));rimMat.uniforms.uTime.value=time;rimMat.uniforms.uEnergy.value=energyNum;rimMat.uniforms.uOpen.value=o;rimMat.uniforms.uPulse.value=pulse;glowMat.uniforms.uTime.value=time;glowMat.uniforms.uEnergy.value=energyNum;glowMat.uniforms.uOpen.value=o;const headA=time*1.05;trails.forEach((line,i)=>{const d=line.userData,pts=line.geometry.attributes.position.array;const head=headA*d.speed+d.phase;for(let j=0;j<18;j++){const t=j/17;const a=head-d.len*t;const rr=d.r-.012*Math.sin(t*Math.PI);const wob=.018*Math.sin(head*2.1+t*5+d.phase);pts[j*3]=Math.cos(a)*rr+wob*Math.cos(a+Math.PI/2);pts[j*3+1]=Math.sin(a)*rr+wob*Math.sin(a+Math.PI/2);pts[j*3+2]=.13+.012*Math.sin(t*Math.PI)}}line.geometry.attributes.position.needsUpdate=true;line.material.opacity=(.07+.22*energyNum)*(1-i/trailCount*.55)});if(pulse>0){pulse=Math.max(0,pulse-.022);glow.scale.setScalar(1+(1-pulse)*.28);trails.forEach(l=>l.material.opacity*=1.0+(1-pulse)*.015)}else glow.scale.setScalar(1);starMat.opacity=.7+Math.sin(time*1.3)*.1;camera.position.x=Math.sin(yaw)*Math.cos(pitch)*distance;camera.position.y=Math.sin(pitch)*distance;camera.position.z=Math.cos(yaw)*Math.cos(pitch)*distance;camera.lookAt(0,0,0);renderer.render(scene,camera)}renderer.setAnimationLoop(animate)</script></body></html>
